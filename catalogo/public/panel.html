<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel General · CRM-ON</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="contenedor">
    <div class="encabezado-panel">
      <h1>Panel General</h1>
      <div class="fecha-panel" id="panel-fecha"></div>
    </div>

    <section class="kpis" id="panel-kpis" aria-label="Indicadores clave"></section>

    <div class="cuadricula">
      <div class="columna">
        <section class="tarjeta" id="tarjeta-cotizaciones-dia" hidden>
          <div class="tarjeta__cabecera">
            <h2 class="tarjeta__titulo">Cotizaciones del día</h2>
            <input type="date" id="panel-filtro-fecha" />
          </div>
          <div class="resumen-cot-dia">
            <div class="resumen-cot-dia__grupo">
              <span class="resumen-cot-dia__etiqueta">Realizadas</span>
              <span class="resumen-cot-dia__valor" id="cot-dia-realizadas">0</span>
              <span class="resumen-cot-dia__importe" id="cot-dia-realizadas-importe"></span>
            </div>
            <div class="resumen-cot-dia__grupo es-bueno">
              <span class="resumen-cot-dia__etiqueta">Ganadas</span>
              <span class="resumen-cot-dia__valor" id="cot-dia-ganadas">0</span>
              <span class="resumen-cot-dia__importe" id="cot-dia-ganadas-importe"></span>
            </div>
            <div class="resumen-cot-dia__grupo es-critico">
              <span class="resumen-cot-dia__etiqueta">Perdidas</span>
              <span class="resumen-cot-dia__valor" id="cot-dia-perdidas">0</span>
            </div>
          </div>
        </section>

        <section class="tarjeta" id="tarjeta-pipeline" hidden>
          <div class="tarjeta__cabecera">
            <h2 class="tarjeta__titulo">Negocios por etapa</h2>
            <span class="tarjeta__subtitulo" id="pipeline-subtitulo"></span>
          </div>
          <div class="pipeline" id="pipeline-lista"></div>
          <div class="pipeline__leyenda">
            <span class="leyenda__punto" style="--marcador:var(--dato-450)">En curso</span>
            <span class="leyenda__punto" style="--marcador:var(--exito)">Ganado</span>
            <span class="leyenda__punto" style="--marcador:var(--peligro)">Perdido</span>
          </div>
        </section>

        <section class="tarjeta" id="tarjeta-vencer" hidden>
          <div class="tarjeta__cabecera">
            <h2 class="tarjeta__titulo">Cotizaciones por vencer</h2>
            <span class="tarjeta__subtitulo">Ordenadas por urgencia</span>
          </div>
          <div class="lista" id="lista-vencer"></div>
        </section>
      </div>

      <div class="columna">
        <section class="tarjeta" id="tarjeta-articulos" hidden>
          <div class="tarjeta__cabecera">
            <h2 class="tarjeta__titulo">Top artículos</h2>
            <span class="tarjeta__subtitulo">Unidades, mes actual</span>
          </div>
          <div class="articulos" id="lista-articulos"></div>
        </section>

        <section class="tarjeta" id="tarjeta-tareas" hidden>
          <div class="tarjeta__cabecera">
            <h2 class="tarjeta__titulo">Tareas de hoy</h2>
            <span class="tarjeta__subtitulo" id="tareas-subtitulo"></span>
          </div>
          <div class="lista" id="lista-tareas"></div>
        </section>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="panel.js"></script>
</body>
</html>
