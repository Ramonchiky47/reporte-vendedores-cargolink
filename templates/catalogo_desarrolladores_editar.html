{% extends "base.html" %}
{% block title %}CargoLink · Editar Desarrollador{% endblock %}
{% set active = "catalogos" %}
{% block content %}
    <div class="card">
      <h2>Editar desarrollador</h2>
      <form method="post" action="{{ url_for('catalogo_desarrolladores_editar', fila_id=fila.id) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="row">
          <div class="field">
            <label for="desarrollador">Desarrollador</label>
            <input type="text" id="desarrollador" name="desarrollador" value="{{ fila.desarrollador }}" required>
          </div>
          <div class="field">
            <label for="plaza">Plaza</label>
            <input type="text" id="plaza" name="plaza" value="{{ fila.plaza }}" required>
          </div>
        </div>
        <button type="submit">Guardar cambios</button>
        <a class="btn secondary" href="{{ url_for('catalogo_desarrolladores') }}">Cancelar</a>
      </form>
    </div>
{% endblock %}
