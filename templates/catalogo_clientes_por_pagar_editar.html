{% extends "base.html" %}
{% block title %}CargoLink · Editar Cliente por Pagar{% endblock %}
{% set active = "catalogos" %}
{% block content %}
    <div class="card">
      <h2>Editar cliente</h2>
      <p class="hint">Cliente asociado: <b>{{ fila.nombre }}</b> (para cambiar el cliente, elimina este registro y agrégalo de nuevo).</p>
      <form method="post" action="{{ url_for('catalogo_clientes_por_pagar_editar', fila_id=fila.id) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="row">
          <div class="field">
            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" value="{{ fila.correo or '' }}">
          </div>
          <div class="field">
            <label for="telefono">Teléfono</label>
            <input type="text" id="telefono" name="telefono" value="{{ fila.telefono or '' }}">
          </div>
        </div>
        <button type="submit">Guardar cambios</button>
        <a class="btn secondary" href="{{ url_for('catalogo_clientes_por_pagar') }}">Cancelar</a>
      </form>
    </div>
{% endblock %}
