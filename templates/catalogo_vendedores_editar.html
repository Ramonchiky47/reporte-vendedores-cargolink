{% extends "base.html" %}
{% block title %}CargoLink · Editar Vendedor{% endblock %}
{% set active = "catalogos" %}
{% block content %}
    <div class="card">
      <h2>Editar vendedor</h2>
      <form method="post" action="{{ url_for('catalogo_vendedores_editar', fila_id=fila.id) }}">
        <div class="row">
          <div class="field">
            <label for="vendedor">Vendedor</label>
            <input type="text" id="vendedor" name="vendedor" value="{{ fila.vendedor }}" required>
          </div>
          <div class="field">
            <label for="plaza">Plaza</label>
            <input type="text" id="plaza" name="plaza" value="{{ fila.plaza }}" required>
          </div>
        </div>
        <div class="field checkbox">
          <label><input type="checkbox" name="ocultar_detalle" {% if fila.ocultar_detalle %}checked{% endif %}> Ocultar detalle de ventas de este vendedor en el reporte</label>
        </div>
        <button type="submit">Guardar cambios</button>
        <a class="btn secondary" href="{{ url_for('catalogo_vendedores') }}">Cancelar</a>
      </form>
    </div>
{% endblock %}
