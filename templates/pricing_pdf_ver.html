{% extends "base.html" %}
{% block title %}CargoLink · {{ fila.referencia }} · Pricing{% endblock %}
{% set active = "pricing" %}
{% block extra_head %}
<style>
  main { max-width: 900px; }
  .ver-encabezado { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .ver-visor { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: #525659; }
  .ver-visor iframe { width: 100%; height: 80vh; border: none; display: block; }
  .ver-acciones { display: flex; align-items: center; gap: 0.6rem; }
  .idioma-switch { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .idioma-switch a { padding: 0.4rem 0.7rem; font-size: 0.8rem; color: #666; background: #fff; text-decoration: none; }
  .idioma-switch a.activo { background: #007CC3; color: #fff; }
</style>
{% endblock %}
{% block content %}
    <div class="ver-encabezado">
      <div>
        <a href="javascript:history.back()" style="display: inline-flex; align-items: center; gap: .3rem; font-size: .82rem; font-weight: 600;">&larr; {{ t.regresar }}</a>
        <h2 style="margin: .4rem 0 0;">{{ fila.referencia }}</h2>
      </div>
      <div class="ver-acciones">
        <div class="idioma-switch">
          <a href="{{ url_for('pricing_ver', solicitud_id=fila.id, idioma='es') }}" class="{{ 'activo' if idioma == 'es' else '' }}">Español</a>
          <a href="{{ url_for('pricing_ver', solicitud_id=fila.id, idioma='en') }}" class="{{ 'activo' if idioma == 'en' else '' }}">English</a>
        </div>
        <a class="btn" href="{{ url_for('pricing_pdf', solicitud_id=fila.id, descargar=1, idioma=idioma) }}">{{ t.descargar_pdf }}</a>
      </div>
    </div>

    <div class="ver-visor">
      <iframe src="{{ url_for('pricing_pdf', solicitud_id=fila.id, idioma=idioma) }}" title="{{ t.vista_previa_de }} {{ fila.referencia }}"></iframe>
    </div>
{% endblock %}
